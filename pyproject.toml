[project]
name = "datametric"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.140.5",
    "clickhouse-connect>=0.7.0",
    "pydantic-settings>=2.0.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "kaggle>=2.2.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[dependency-groups]
dev = [
    "ruff>=0.16.2",
]
