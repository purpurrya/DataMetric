services:
  datametric:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datametric-app
    ports:
      - "8000:8000"
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DEBUG=true
    volumes:
      - ./scripts:/app/scripts
      - ./main.py:/app/main.py
      - ./schemas.py:/app/schemas.py
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - datametric-network
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: datametric-dashboard
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://datametric:8000
    volumes:
      - ./dashboard:/app/dashboard
    depends_on:
      - datametric
    networks:
      - datametric-network
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: datametric-clickhouse
    hostname: clickhouse
    environment:
      - CLICKHOUSE_DB=${CLICKHOUSE_DB}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ports:
      - "8123:8123"
      - "9000:9000"
      - "9009:9009"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./sql:/docker-entrypoint-initdb.d
    networks:
      - datametric-network
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: datametric-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - datametric-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  datametric-network:
    driver: bridge

volumes:
  clickhouse_data:
    driver: local
  redis_data:
    driver: local
